<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f3ee"/>
      <stop offset="100%" stop-color="#ede9e0"/>
    </linearGradient>
    <radialGradient id="halo1" cx="0.15" cy="0.2" r="0.5">
      <stop offset="0%" stop-color="#cabff0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#cabff0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="0.9" cy="0.85" r="0.55">
      <stop offset="0%" stop-color="#a9dcc4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a9dcc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo3" cx="0.85" cy="0.1" r="0.4">
      <stop offset="0%" stop-color="#f7c2a8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f7c2a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6a52b8"/>
      <stop offset="50%" stop-color="#3a76b0"/>
      <stop offset="100%" stop-color="#2f7d5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6a52b8"/>
      <stop offset="50%" stop-color="#3a76b0"/>
      <stop offset="100%" stop-color="#2f7d5f"/>
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="14" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#halo1)"/>
  <rect width="1200" height="630" fill="url(#halo2)"/>
  <rect width="1200" height="630" fill="url(#halo3)"/>

  <!-- Logo + brand line (top-left) -->
  <g transform="translate(80,80)">
    <rect width="56" height="56" rx="14" fill="url(#logo)"/>
    <g transform="translate(15,12) scale(0.052)" fill="#ffffff">
      <path d="M256 0c4.6 0 9.2 1 13.4 2.9L457.7 82.8c22 9.3 38.4 31 38.3 57.2c-.5 99.2-41.3 280.7-213.6 363.2c-16.7 8-36.1 8-52.8 0C57.3 420.7 16.5 239.2 16 140c-.1-26.2 16.3-47.9 38.3-57.2L242.7 2.9C246.8 1 251.4 0 256 0zm0 66.8V444.8C394 378 431.1 230.1 432 141.4L256 66.8l0 0z"/>
    </g>
    <text x="76" y="24" font-family="Inter, -apple-system, sans-serif"
          font-size="15" font-weight="700" fill="#1a1a30" letter-spacing="0.5">GMS</text>
    <text x="76" y="46" font-family="Inter, -apple-system, sans-serif"
          font-size="14" font-weight="500" fill="#5e5e76">Grant Management System</text>
  </g>

  <!-- Eyebrow line (top-left, below logo) -->
  <g transform="translate(80,180)">
    <rect width="40" height="1" y="9" fill="#5e5e76"/>
    <circle cx="52" cy="9" r="4" fill="#6a52b8"/>
    <text x="68" y="14" font-family="'Courier New', monospace" font-size="13"
          font-weight="600" fill="#5e5e76" letter-spacing="2.5">CITRIN COOPERMAN  ·  PANEL PITCH</text>
  </g>

  <!-- Main headline -->
  <text x="80" y="290" font-family="Inter, -apple-system, sans-serif"
        font-size="68" font-weight="800" fill="#1a1a30" letter-spacing="-2.3">The grant</text>
  <text x="80" y="362" font-family="Inter, -apple-system, sans-serif"
        font-size="68" font-weight="800" fill="#1a1a30" letter-spacing="-2.3">engagement,</text>
  <text x="80" y="442" font-family="Georgia, 'Instrument Serif', serif"
        font-style="italic" font-size="72" font-weight="400" fill="url(#accent)"
        letter-spacing="-1.5">in one system.</text>

  <!-- Subhead -->
  <text x="80" y="500" font-family="Inter, -apple-system, sans-serif"
        font-size="20" font-weight="400" fill="#5e5e76">Enterprise-grade nonprofit grant platform —</text>
  <text x="80" y="528" font-family="Inter, -apple-system, sans-serif"
        font-size="20" font-weight="400" fill="#5e5e76">built in-house, in production, ready to scale.</text>

  <!-- Floating pills (right side, evocative of slide 1) -->
  <g transform="translate(820,140)" filter="url(#card-shadow)">
    <rect width="220" height="56" rx="14" fill="#ffffff" stroke="#e0ddd2"/>
    <rect x="14" y="14" width="28" height="28" rx="8" fill="#cabff0"/>
    <circle cx="28" cy="28" r="8" fill="#6a52b8"/>
    <text x="56" y="35" font-family="Inter, -apple-system, sans-serif"
          font-size="16" font-weight="600" fill="#1a1a30">Billing</text>
  </g>

  <g transform="translate(880,250)" filter="url(#card-shadow)">
    <rect width="240" height="56" rx="14" fill="#ffffff" stroke="#e0ddd2"/>
    <rect x="14" y="14" width="28" height="28" rx="8" fill="#a9dcc4"/>
    <rect x="20" y="20" width="16" height="16" rx="3" fill="#2f7d5f"/>
    <text x="56" y="35" font-family="Inter, -apple-system, sans-serif"
          font-size="16" font-weight="600" fill="#1a1a30">GL Import</text>
  </g>

  <g transform="translate(820,360)" filter="url(#card-shadow)">
    <rect width="200" height="56" rx="14" fill="#ffffff" stroke="#e0ddd2"/>
    <rect x="14" y="14" width="28" height="28" rx="8" fill="#f7c2a8"/>
    <path d="M28 16 L36 22 L36 30 Q36 36 28 40 Q20 36 20 30 L20 22 Z" fill="#b86440"/>
    <text x="56" y="35" font-family="Inter, -apple-system, sans-serif"
          font-size="16" font-weight="600" fill="#1a1a30">Audit</text>
  </g>

  <g transform="translate(900,470)" filter="url(#card-shadow)">
    <rect width="200" height="56" rx="14" fill="#ffffff" stroke="#e0ddd2"/>
    <rect x="14" y="14" width="28" height="28" rx="8" fill="#a8cfee"/>
    <circle cx="22" cy="26" r="4" fill="#3a76b0"/>
    <circle cx="32" cy="26" r="4" fill="#3a76b0"/>
    <path d="M14 36 Q22 30 22 36 M24 36 Q32 30 32 36" fill="none" stroke="#3a76b0" stroke-width="3"/>
    <text x="56" y="35" font-family="Inter, -apple-system, sans-serif"
          font-size="16" font-weight="600" fill="#1a1a30">Portal</text>
  </g>

  <!-- Bottom strip: stats -->
  <line x1="80" y1="568" x2="540" y2="568" stroke="#e0ddd2" stroke-width="1"/>
  <g transform="translate(80,584)">
    <text font-family="'Courier New', monospace" font-size="11" font-weight="500"
          fill="#8d8d9e" letter-spacing="1.5">MODULES</text>
    <text y="24" font-family="Inter, -apple-system, sans-serif" font-size="22"
          font-weight="700" fill="#1a1a30">190+</text>
  </g>
  <g transform="translate(240,584)">
    <text font-family="'Courier New', monospace" font-size="11" font-weight="500"
          fill="#8d8d9e" letter-spacing="1.5">TABLES</text>
    <text y="24" font-family="Inter, -apple-system, sans-serif" font-size="22"
          font-weight="700" fill="#1a1a30">71</text>
  </g>
  <g transform="translate(360,584)">
    <text font-family="'Courier New', monospace" font-size="11" font-weight="500"
          fill="#8d8d9e" letter-spacing="1.5">EXPORTS</text>
    <text y="24" font-family="Inter, -apple-system, sans-serif" font-size="22"
          font-weight="700" fill="#1a1a30">14</text>
  </g>

  <!-- Slide indicator (bottom-right) -->
  <text x="1120" y="612" text-anchor="end" font-family="'Courier New', monospace"
        font-size="11" font-weight="500" fill="#8d8d9e" letter-spacing="2">26 MAY 2026  ·  PANEL PITCH</text>
</svg>
